<!doctype html>
<html lang="ru">

    <title>Bypass proxy (ru)</title>
    <link rel="stylesheet" href="css/landing.css" />
  </head>
  <body>
    <main class="stage">
      <p class="lang">
        <button type="button" class="lang__btn" data-lang="ru" aria-pressed="true">RU</button>
        <span class="lang__sep" aria-hidden="true">/</span>
        <button type="button" class="lang__btn" data-lang="en" aria-pressed="false">EN</button>
      </p>

      <button type="button" class="open" data-open data-i18n="open">Расширения Firefox</button>
    </main>

    <div class="modal" data-modal hidden>
      <div class="modal__backdrop" data-close></div>

      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="ext-name">
        <button type="button" class="modal__close" data-close data-i18n-close aria-label="Закрыть">
          <span aria-hidden="true">&times;</span>

        <a class="ext" href="about.html">
          <img class="ext__icon" src="img/icon-128.png" alt="" width="72" height="72" />

    <script src="js/site.js"></script>
